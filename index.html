<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<!-- ============================================================
     НАСТРОЙКИ ЭКРАНА
     ============================================================
     width=device-width — ширина страницы = ширина экрана
     initial-scale=1.0 — без автозума при открытии
     maximum-scale=1.0, user-scalable=no — запрет пинч-зума
     viewport-fit=cover — контент под чёлкой/Dynamic Island
     ============================================================ -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<!-- ============================================================
     РЕЖИМ ВЕБ-ПРИЛОЖЕНИЯ (iOS)
     ============================================================
     Работает только если сайт добавлен на главный экран.
     Открывается без адресной строки, как настоящее приложение.
     ============================================================ -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Padel">
<meta name="theme-color" content="#1a1d21">

<title>Padel Score</title>

<style>
    /* ============================================================
       БАЗОВЫЕ СБРОСЫ
       ============================================================
       box-sizing — padding и border входят в ширину
       -webkit-tap-highlight-color — убирает серую вспышку при тапе
       ============================================================ */
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        /* Убираем "резиновый" отскок страницы на iOS */
        overscroll-behavior: none;
    }

    /* ============================================================
       ОСНОВНОЙ ФОН И ШРИФТ
       ============================================================ */
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #1a1d21;
        color: #e8eaed;
        min-height: 100vh;
        user-select: none;
        -webkit-user-select: none;

        /* Безопасные отступы: чёлка, полоса жестов */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
    }

    /* ============================================================
       КОНТЕЙНЕР ПРИЛОЖЕНИЯ
       ============================================================
       Занимает всю высоту экрана, распределяет содержимое:
       заголовок сверху, игровое поле посередине, кнопки снизу.
       ============================================================ */
    .app {
        max-width: 700px;
        margin: 0 auto;
        padding: 12px 12px 14px;
        /* 100dvh — динамическая высота вьюпорта (учитывает панели Safari) */
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
    }

    /* ============================================================
       ЗАГОЛОВОК "🎾 PADEL SCORE"
       ============================================================ */
    h1 {
        text-align: center;
        margin: 2px 0 12px;
        font-size: 22px;
        letter-spacing: 3px;
        color: #8ab4a0;
        text-transform: uppercase;
        font-weight: 700;
        flex-shrink: 0;   /* не сжимается */
    }

    /* ============================================================
       ИГРОВОЕ ПОЛЕ — ДВЕ КАРТОЧКИ
       ============================================================
       flex: 1 — занимает всё свободное место между заголовком
       и кнопками. Минимальная высота 0, чтобы могло сжиматься.
       ============================================================ */
    .scoreboard {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        flex: 1;
        min-height: 0;
    }

    /* ============================================================
       КАРТОЧКА ОДНОЙ КОМАНДЫ (она же кнопка "+1 очко")
       ============================================================ */
    .score-card {
        background: #262b30;
        border-radius: 20px;
        padding: 16px 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border: 2px solid #333a41;
        transition: border-color 0.2s, background 0.2s, transform 0.05s;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        /* min-height убран — карточка растягивается по flex */
    }

    /* Эффект нажатия */
    .score-card:active {
        transform: scale(0.98);
        background: #2e3439;
    }

    /* Подсветка карточки подающей команды */
    .score-card.serving {
        border-color: #8ab4a0;
        background: #2a3438;
    }
    .score-card.serving:active {
        background: #33403f;
    }

    /* ============================================================
       ВЕРХНИЙ БЛОК (название команды, подающий, "подача")
       ============================================================
       Абсолютное позиционирование — прибит к верху карточки,
       цифры отдельно центрируются.
       ============================================================ */
    .card-top {
        position: absolute;
        top: 16px;
        left: 0;
        right: 0;
        padding: 0 10px;
        text-align: center;
    }

    /* Название команды */
    .team-label {
        font-size: 12px;
        letter-spacing: 1px;
        color: #b8c0c8;
        text-transform: uppercase;
        font-weight: 700;
        margin-bottom: 3px;
        height: 16px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    /* Имя подающего игрока */
    .server-name {
        font-size: 14px;
        font-weight: 700;
        color: #e8eaed;
        height: 18px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    /* Надпись "подача" — видна только у подающей команды */
    .serve-indicator {
        font-size: 11px;
        font-weight: 700;
        color: #8ab4a0;
        letter-spacing: 1px;
        height: 14px;
        opacity: 0;
        transition: opacity 0.2s;
        text-transform: uppercase;
        margin-top: 2px;
    }
    .score-card.serving .serve-indicator {
        opacity: 1;
    }

    /* ============================================================
       ЦИФРА СЧЁТА (по центру карточки)
       ============================================================
       Размер адаптивный: min(20vw, 90px) — на узком экране меньше,
       на широком больше, но не более 90px.
       ============================================================ */
    .points {
        font-size: clamp(60px, 22vw, 96px);
        font-weight: 800;
        line-height: 1;
        color: #e8eaed;
        font-variant-numeric: tabular-nums;
        margin-top: 40px;   /* сдвиг вниз, чтобы не лезло под текст */
    }
    .score-card.serving .points {
        color: #a8d5be;
    }

    /* ============================================================
       НИЖНЯЯ ПАНЕЛЬ С КНОПКАМИ
       ============================================================ */
    .controls {
        display: flex;
        gap: 8px;
        margin-top: 12px;
        flex-shrink: 0;
    }

    /* Обычная кнопка */
    .control-button {
        flex: 1;
        border: none;
        border-radius: 12px;
        padding: 14px 6px;
        font-size: 24px;
        line-height: 1;
        background: #2e343a;
        color: #e8eaed;
        cursor: pointer;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Symbol", sans-serif;
    }
    .control-button:active {
        transform: scale(0.97);
        background: #383f47;
    }

    /* Кнопка "Новая игра" — красная */
    .reset {
        background: #8b4a4a;
        color: #ffffff;
    }
    .reset:active {
        background: #723c3c;
    }

    /* Сообщение по центру (Новая игра / Сохранено) */
    .message {
        text-align: center;
        min-height: 18px;
        margin-top: 6px;
        font-weight: 700;
        font-size: 14px;
        color: #a8d5be;
        letter-spacing: 0.5px;
        flex-shrink: 0;
    }

    /* ============================================================
       МОДАЛЬНОЕ ОКНО НАСТРОЕК
       ============================================================ */
    .modal-overlay {
        position: fixed;
        top: 0; right: 0; bottom: 0; left: 0;
        background: rgba(0,0,0,0.7);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 100;
        padding: 20px;
    }
    .modal-overlay.open {
        display: flex;
    }

    .modal {
        background: #262b30;
        border-radius: 18px;
        padding: 22px 18px;
        width: 100%;
        max-width: 400px;
        border: 2px solid #3a424a;
        max-height: 90vh;
        overflow-y: auto;
    }

    .modal h2 {
        margin: 0 0 18px;
        font-size: 18px;
        text-align: center;
        color: #a8d5be;
        letter-spacing: 1px;
    }

    /* Заголовок раздела (Команды, Игроки, Интерфейс) */
    .modal h3 {
        margin: 18px 0 10px;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #8a929a;
        border-top: 1px solid #3a424a;
        padding-top: 14px;
    }

    /* Поле ввода */
    .field { margin-bottom: 14px; }
    .field label {
        display: block;
        font-size: 13px;
        color: #8a929a;
        margin-bottom: 5px;
        letter-spacing: 0.5px;
    }
    .field input {
        width: 100%;
        background: #1a1d21;
        border: 2px solid #3a424a;
        border-radius: 10px;
        padding: 12px;
        color: #e8eaed;
        font-size: 16px;
        font-weight: 600;
        outline: none;
    }
    .field input:focus {
        border-color: #8ab4a0;
    }

    /* Переключатель вкл/выкл */
    .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 0;
    }
    .toggle-row span {
        font-size: 14px;
        color: #e8eaed;
        font-weight: 600;
    }
    .toggle {
        position: relative;
        width: 50px;
        height: 28px;
        background: #3a424a;
        border-radius: 14px;
        cursor: pointer;
        transition: background 0.2s;
        flex-shrink: 0;
    }
    .toggle::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 22px;
        height: 22px;
        background: #e8eaed;
        border-radius: 50%;
        transition: transform 0.2s;
    }
    .toggle.on { background: #4a7c59; }
    .toggle.on::after { transform: translateX(22px); }

    /* Кнопки модалки */
    .modal-buttons {
        display: flex;
        gap: 10px;
        margin-top: 20px;
    }
    .modal-buttons button {
        flex: 1;
        border: none;
        border-radius: 12px;
        padding: 14px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        background: #2e343a;
        color: #e8eaed;
    }
    .modal-buttons .save {
        background: #4a7c59;
        color: #fff;
    }

    .hidden { display: none !important; }

    /* ============================================================
       ЛАНДШАФТНЫЙ РЕЖИМ (телефон на боку)
       ============================================================
       - Скрываем заголовок (мешает)
       - Центрируем всё по вертикали
       - Карточки с отступами сверху и снизу
       ============================================================ */
    @media (orientation: landscape) {
        /* Прячем заголовок в горизонтали */
        h1 {
            display: none;
        }

        .app {
            padding: 10px 40px 10px;
            max-width: 100%;
            /* Центрируем по вертикали */
            justify-content: center;
            min-height: 100dvh;
        }

        /* Игровое поле — не на всю высоту, с отступами */
        .scoreboard {
            flex: 0 1 auto;
            max-height: 75dvh;
            width: 100%;
            /* Центрируем по горизонтали */
            margin: 0 auto;
        }

        .score-card {
            padding: 12px 10px;
        }

        .card-top {
            top: 10px;
        }

        .team-label { font-size: 10px; height: 13px; margin-bottom: 2px; }
        .server-name { font-size: 12px; height: 15px; }
        .serve-indicator { font-size: 10px; height: 13px; }

        .points {
            font-size: clamp(48px, 14vh, 72px);
            margin-top: 26px;
        }

        .controls {
            margin-top: 10px;
            max-width: 600px;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
        }

        .control-button {
            padding: 10px 6px;
            font-size: 20px;
        }

        .message {
            min-height: 16px;
            font-size: 12px;
            margin-top: 4px;
        }
    }

    /* Очень низкие ландшафтные экраны (iPhone SE) */
    @media (orientation: landscape) and (max-height: 400px) {
        .scoreboard { max-height: 70dvh; }
        .points { font-size: 52px; margin-top: 20px; }
        .card-top { top: 8px; }
    }
</style>
</head>

<body>

<div class="app">

    <!-- ЗАГОЛОВОК -->
    <h1>🎾 Padel Score</h1>

    <!-- ИГРОВОЕ ПОЛЕ -->
    <div class="scoreboard">

        <!-- КАРТОЧКА КОМАНДЫ 1 -->
        <div class="score-card" id="card0">
            <div class="card-top">
                <div class="team-label" id="teamLabel0">Команда 1</div>
                <div class="server-name" id="server0">—</div>
                <div class="serve-indicator">подача</div>
            </div>
            <div class="points" id="score0">0</div>
        </div>

        <!-- КАРТОЧКА КОМАНДЫ 2 -->
        <div class="score-card" id="card1">
            <div class="card-top">
                <div class="team-label" id="teamLabel1">Команда 2</div>
                <div class="server-name" id="server1">—</div>
                <div class="serve-indicator">подача</div>
            </div>
            <div class="points" id="score1">0</div>
        </div>

    </div>

    <!-- Сообщение -->
    <div class="message" id="message"></div>

    <!-- НИЖНИЕ КНОПКИ -->
    <div class="controls">
        <button type="button" class="control-button hidden" id="btnSwitch" title="Смена подачи">S</button>
        <button type="button" class="control-button" id="btnUndo" title="Отмена">&#x21B6;&#xFE0E;</button>
        <button type="button" class="control-button" id="btnSettings" title="Настройки">&#x2699;&#xFE0E;</button>
        <button type="button" class="control-button reset" id="btnReset" title="Новая игра">&#x21BB;&#xFE0E;</button>
    </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО НАСТРОЕК -->
<div class="modal-overlay" id="settingsModal">
    <div class="modal">
        <h2>Настройки</h2>

        <h3>Команды</h3>
        <div class="field">
            <label>Название команды 1</label>
            <input id="teamName0" value="Команда 1" maxlength="16">
        </div>
        <div class="field">
            <label>Название команды 2</label>
            <input id="teamName1" value="Команда 2" maxlength="16">
        </div>

        <h3>Игроки</h3>
        <div class="field">
            <label>Команда 1 — Игрок 1</label>
            <input id="p1" value="Игрок 1" maxlength="16">
        </div>
        <div class="field">
            <label>Команда 1 — Игрок 2</label>
            <input id="p2" value="Игрок 2" maxlength="16">
        </div>
        <div class="field">
            <label>Команда 2 — Игрок 3</label>
            <input id="p3" value="Игрок 3" maxlength="16">
        </div>
        <div class="field">
            <label>Команда 2 — Игрок 4</label>
            <input id="p4" value="Игрок 4" maxlength="16">
        </div>

        <h3>Интерфейс</h3>
        <div class="toggle-row">
            <span>Показывать кнопку смены подачи</span>
            <div class="toggle" id="toggleSwitch"></div>
        </div>

        <div class="modal-buttons">
            <button type="button" id="btnCancelSettings">Отмена</button>
            <button type="button" class="save" id="btnSaveSettings">Сохранить</button>
        </div>
    </div>
</div>

<script>
(function () {
    "use strict";

    var STORAGE_KEY = "padel_score_v8";

    /* Состояние приложения */
    var players = ["Игрок 1", "Игрок 2", "Игрок 3", "Игрок 4"];
    var teamNames = ["Команда 1", "Команда 2"];
    var points = [0, 0];
    var serverIndex = 0;
    var history = [];
    var showSwitchButton = false;

    /* Порядок подачи: 0 → 2 → 1 → 3 → 0 ... */
    var order = [0, 2, 1, 3];

    function $(id) { return document.getElementById(id); }

    function nextServer(idx) {
        var pos = order.indexOf(idx);
        if (pos === -1) pos = 0;
        return order[(pos + 1) % 4];
    }

    function serverTeam() {
        return serverIndex < 2 ? 0 : 1;
    }

    function saveHistory() {
        history.push({
            points: [points[0], points[1]],
            serverIndex: serverIndex
        });
    }

    function addPoint(team) {
        saveHistory();
        points[team] = points[team] + 1;
        serverIndex = nextServer(serverIndex);
        update();
        saveState();
    }

    function switchServe() {
        saveHistory();
        serverIndex = nextServer(serverIndex);
        update();
        saveState();
    }

    function undo() {
        if (history.length === 0) {
            showMessage("Нечего отменять");
            return;
        }
        var prev = history.pop();
        points = prev.points;
        serverIndex = prev.serverIndex;
        update();
        saveState();
    }

    function resetGame() {
        if (!confirm("Начать новую игру?")) return;
        points = [0, 0];
        serverIndex = 0;
        history = [];
        update();
        saveState();
        showMessage("Новая игра");
    }

    function update() {
        $("score0").textContent = points[0];
        $("score1").textContent = points[1];

        $("teamLabel0").textContent = teamNames[0];
        $("teamLabel1").textContent = teamNames[1];

        var st = serverTeam();
        var name = players[serverIndex];
        $("server0").textContent = st === 0 ? name : "—";
        $("server1").textContent = st === 1 ? name : "—";

        if (st === 0) {
            $("card0").classList.add("serving");
            $("card1").classList.remove("serving");
        } else {
            $("card1").classList.add("serving");
            $("card0").classList.remove("serving");
        }

        if (showSwitchButton) {
            $("btnSwitch").classList.remove("hidden");
        } else {
            $("btnSwitch").classList.add("hidden");
        }
    }

    function showMessage(text) {
        var el = $("message");
        el.textContent = text;
        setTimeout(function () {
            if (el.textContent === text) el.textContent = "";
        }, 2000);
    }

    function openSettings()] {
        $("teamName0").value = teamNames[0];
        $("teamName1").value = teamNames[1];
        $("p1").value = players[0];
        $("p2").value = players[1];
        $("p3").value = players[2];
        $("p4").value = players[3];
        $("toggleSwitch").classList.toggle("on", = showSwitchButton);
        $("settingsModal").classList.add $("open");
    }

    function closeSettings() {
("        $("settingsModal").classList.remove("open");
team    }

    function saveSettings() {
        teamNames[0Name0").value.trim() || "Команда 1";
        teamNames[1] = $("teamName1").value.trim() || "Команда 2";
        players[0] = $("p1").value.trim() || "Игрок 1";
        players[1] = $("p2").value.trim() || "Игрок 2";
        players[2] = $("p3").value.trim() || "Игрок 3";
        players[3] = $("p4").value.trim() || "Игрок 4";
        showSwitchButton = $("toggleSwitch").classList.contains("on");
        closeSettings();
        update();
        saveState();
        showMessage("Сохранено");
    }

    function saveState() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                players: players,
                teamNames: teamNames,
                points: points,
                serverIndex: serverIndex,
                showSwitchButton: showSwitchButton
            }));
        } catch (e) { console.warn("save error", e); }
    }

    function loadState() {
        try {
            var raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return;
            var s = JSON.parse(raw);
            if (Array.isArray(s.players) && s.players.length === 4) players = s.players;
            if (Array.isArray(s.teamNames) && s.teamNames.length === 2) teamNames = s.teamNames;
            if (Array.isArray(s.points) && s.points.length === 2) points = s.points;
            if (typeof s.serverIndex === "number") serverIndex = s.serverIndex;
            if (typeof s.showSwitchButton === "boolean") showSwitchButton = s.showSwitchButton;
        } catch (e) { console.warn("load error", e); }
    }

    function bind() {
        $("card0").addEventListener("click", function () { addPoint(0); });
        $("card1").addEventListener("click", function () { addPoint(1); });

        $("btnSwitch").addEventListener("click", switchServe);
        $("btnUndo").addEventListener("click", undo);
        $("btnReset").addEventListener("click", resetGame);
        $("btnSettings").addEventListener("click", openSettings);
        $("btnCancelSettings").addEventListener("click", closeSettings);
        $("btnSaveSettings").addEventListener("click", saveSettings);
        $("toggleSwitch").addEventListener("click", function () {
            this.classList.toggle("on");
        });
    }

    /* Очистка старых сохранений */
    try {
        localStorage.removeItem("padel_score_state");
        localStorage.removeItem("padel_score_v2");
        localStorage.removeItem("padel_score_v3");
        localStorage.removeItem("padel_score_v4");
        localStorage.removeItem("padel_score_v5");
        localStorage.removeItem("padel_score_v6");
        localStorage.removeItem("padel_score_v7");
    } catch (e) {}

    bind();
    loadState();
    update();

})();
</script>

</body>
</html>
