<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Padel Score</title>

<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; min-height: 100%; overscroll-behavior: none; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #1a1d21;
        color: #e8eaed;
        min-height: 100vh;
        user-select: none;
    }

    .app {
        max-width: 700px;
        margin: 0 auto;
        padding: 16px 12px 20px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    h1 {
        text-align: center;
        margin: 4px 0 16px;
        font-size: 24px;
        letter-spacing: 3px;
        color: #8ab4a0;
        text-transform: uppercase;
        font-weight: 700;
    }

    .scoreboard {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        flex: 1;
    }

    .score-card {
        background: #262b30;
        border-radius: 20px;
        padding: 22px 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border: 2px solid #333a41;
        transition: border-color 0.2s, background 0.2s, transform 0.05s;
        min-height: 320px;
        cursor: pointer;
        -webkit-user-select: none;
        user-select: none;
        position: relative;
    }

    .score-card:active {
        transform: scale(0.98);
        background: #2e3439;
    }

    .score-card.serving {
        border-color: #8ab4a0;
        background: #2a3438;
    }

    .score-card.serving:active {
        background: #33403f;
    }

    .card-top {
        position: absolute;
        top: 22px;
        left: 0;
        right: 0;
        padding: 0 12px;
        text-align: center;
    }

    .team-label {
        font-size: 13px;
        letter-spacing: 1px;
        color: #b8c0c8;
        text-transform: uppercase;
        font-weight: 700;
        margin-bottom: 4px;
        height: 18px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .server-name {
        font-size: 15px;
        font-weight: 700;
        color: #e8eaed;
        height: 20px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .serve-indicator {
        font-size: 12px;
        font-weight: 700;
        color: #8ab4a0;
        letter-spacing: 1px;
        height: 16px;
        opacity: 0;
        transition: opacity 0.2s;
        text-transform: uppercase;
        margin-top: 2px;
    }

    .score-card.serving .serve-indicator { opacity: 1; }

    .points {
        font-size: 96px;
        font-weight: 800;
        line-height: 1;
        color: #e8eaed;
        font-variant-numeric: tabular-nums;
        margin-top: 30px;
    }

    .score-card.serving .points { color: #a8d5be; }

    .controls {
        display: flex;
        gap: 8px;
        margin-top: 14px;
    }

    .control-button {
        flex: 1;
        border: none;
        border-radius: 12px;
        padding: 16px 6px;
        font-size: 26px;
        line-height: 1;
        font-weight: 400;
        background: #2e343a;
        color: #e8eaed;
        cursor: pointer;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Symbol", sans-serif;
    }

    .control-button:active { transform: scale(0.97); background: #383f47; }

    .reset { background: #8b4a4a; color: #ffffff; }
    .reset:active { background: #723c3c; }

    .message {
        text-align: center;
        min-height: 22px;
        margin-top: 10px;
        font-weight: 700;
        font-size: 15px;
        color: #a8d5be;
        letter-spacing: 0.5px;
    }

    .modal-overlay {
        position: fixed;
        top: 0; right: 0; bottom: 0; left: 0;
        background: rgba(0,0,0,0.7);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 100;
        padding: 20px;
    }

    .modal-overlay.open { display: flex; }

    .modal {
        background: #262b30;
        border-radius: 18px;
        padding: 22px 18px;
        width: 100%;
        max-width: 400px;
        border: 2px solid #3a424a;
        max-height: 90vh;
        overflow-y: auto;
    }

    .modal h2 {
        margin: 0 0 18px;
        font-size: 18px;
        text-align: center;
        color: #a8d5be;
        letter-spacing: 1px;
    }

    .modal h3 {
        margin: 18px 0 10px;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #8a929a;
        border-top: 1px solid #3a424a;
        padding-top: 14px;
    }

    .field { margin-bottom: 14px; }

    .field label {
        display: block;
        font-size: 13px;
        color: #8a929a;
        margin-bottom: 5px;
        letter-spacing: 0.5px;
    }

    .field input {
        width: 100%;
        background: #1a1d21;
        border: 2px solid #3a424a;
        border-radius: 10px;
        padding: 12px;
        color: #e8eaed;
        font-size: 16px;
        font-weight: 600;
        outline: none;
    }

    .field input:focus { border-color: #8ab4a0; }

    .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 0;
    }

    .toggle-row span {
        font-size: 14px;
        color: #e8eaed;
        font-weight: 600;
    }

    .toggle {
        position: relative;
        width: 50px;
        height: 28px;
        background: #3a424a;
        border-radius: 14px;
        cursor: pointer;
        transition: background 0.2s;
        flex-shrink: 0;
    }

    .toggle::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 22px;
        height: 22px;
        background: #e8eaed;
        border-radius: 50%;
        transition: transform 0.2s;
    }

    .toggle.on { background: #4a7c59; }
    .toggle.on::after { transform: translateX(22px); }

    .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }

    .modal-buttons button {
        flex: 1;
        border: none;
        border-radius: 12px;
        padding: 14px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        background: #2e343a;
        color: #e8eaed;
    }

    .modal-buttons .save { background: #4a7c59; color: #fff; }

    .hidden { display: none !important; }

    /* Ландшафтный режим */
    @media (orientation: landscape) {
        .app {
            padding: 12px 40px 14px;
            max-width: 900px;
        }

        h1 {
            font-size: 18px;
            margin: 0 0 10px;
        }

        .scoreboard {
            max-height: 60vh;
            margin: 0 auto;
            width: 100%;
        }

        .score-card {
            min-height: 0;
            padding: 14px 10px;
        }

        .card-top {
            top: 14px;
        }

        .team-label { font-size: 11px; height: 14px; margin-bottom: 2px; }
        .server-name { font-size: 13px; height: 17px; }
        .serve-indicator { font-size: 11px; height: 14px; }

        .points {
            font-size: 72px;
            margin-top: 20px;
        }

        .controls {
            margin-top: 10px;
        }

        .control-button {
            padding: 12px 6px;
            font-size: 22px;
        }

        .message {
            min-height: 18px;
            font-size: 13px;
            margin-top: 6px;
        }
    }

    @media (orientation: landscape) and (max-height: 400px) {
        .scoreboard { max-height: 55vh; }
        .points { font-size: 60px; margin-top: 14px; }
        .card-top { top: 10px; }
        h1 { font-size: 16px; margin-bottom: 6px; }
    }
</style>
</head>

<body>

<div class="app">
    <h1>🎾 Padel Score</h1>

    <div class="scoreboard">
        <div class="score-card" id="card0">
            <div class="card-top">
                <div class="team-label" id="teamLabel0">Команда 1</div>
                <div class="server-name" id="server0">—</div>
                <div class="serve-indicator">подача</div>
            </div>
            <div class="points" id="score0">0</div>
        </div>

        <div class="score-card" id="card1">
            <div class="card-top">
                <div class="team-label" id="teamLabel1">Команда 2</div>
                <div class="server-name" id="server1">—</div>
                <div class="serve-indicator">подача</div>
            </div>
            <div class="points" id="score1">0</div>
        </div>
    </div>

    <div class="message" id="message"></div>

    <div class="controls">
        <button type="button" class="control-button hidden" id="btnSwitch" title="Смена подачи">S</button>
        <button type="button" class="control-button" id="btnUndo" title="Отмена">&#x21B6;&#xFE0E;</button>
        <button type="button" class="control-button" id="btnSettings" title="Настройки">&#x2699;&#xFE0E;</button>
        <button type="button" class="control-button reset" id="btnReset" title="Новая игра">&#x21BB;&#xFE0E;</button>
    </div>
</div>

<div class="modal-overlay" id="settingsModal">
    <div class="modal">
        <h2>Настройки</h2>

        <h3>Команды</h3>
        <div class="field">
            <label>Название команды 1</label>
            <input id="teamName0" value="Команда 1" maxlength="16">
        </div>
        <div class="field">
            <label>Название команды 2</label>
            <input id="teamName1" value="Команда 2" maxlength="16">
        </div>

        <h3>Игроки</h3>
        <div class="field">
            <label>Команда 1 — Игрок 1</label>
            <input id="p1" value="Игрок 1" maxlength="16">
        </div>
        <div class="field">
            <label>Команда 1 — Игрок 2</label>
            <input id="p2" value="Игрок 2" maxlength="16">
        </div>
        <div class="field">
            <label>Команда 2 — Игрок 3</label>
            <input id="p3" value="Игрок 3" maxlength="16">
        </div>
        <div class="field">
            <label>Команда 2 — Игрок 4</label>
            <input id="p4" value="Игрок 4" maxlength="16">
        </div>

        <h3>Интерфейс</h3>
        <div class="toggle-row">
            <span>Показывать кнопку смены подачи</span>
            <div class="toggle" id="toggleSwitch"></div>
        </div>

        <div class="modal-buttons">
            <button type="button" id="btnCancelSettings">Отмена</button>
            <button type="button" class="save" id="btnSaveSettings">Сохранить</button>
        </div>
    </div>
</div>

<script>
(function () {
    "use strict";

    var STORAGE_KEY = "padel_score_v6";

    var players = ["Игрок 1", "Игрок 2", "Игрок 3", "Игрок 4"];
    var teamNames = ["Команда 1", "Команда 2"];
    var points = [0, 0];
    var serverIndex = 0;
    var history = [];
    var showSwitchButton = false;

    var order = [0, 2, 1, 3];

    function $(id) { return document.getElementById(id); }

    function nextServer(idx) {
        var pos = order.indexOf(idx);
        if (pos === -1) pos = 0;
        return order[(pos + 1) % 4];
    }

    function serverTeam() {
        return serverIndex < 2 ? 0 : 1;
    }

    function saveHistory() {
        history.push({
            points: [points[0], points[1]],
            serverIndex: serverIndex
        });
    }

    function addPoint(team) {
        saveHistory();
        points[team] = points[team] + 1;
        serverIndex = nextServer(serverIndex);
        update();
        saveState();
    }

    function switchServe() {
        saveHistory();
        serverIndex = nextServer(serverIndex);
        update();
        saveState();
    }

    function undo() {
        if (history.length === 0) {
            showMessage("Нечего отменять");
            return;
        }
        var prev = history.pop();
        points = prev.points;
        serverIndex = prev.serverIndex;
        update();
        saveState();
    }

    function resetGame() {
        if (!confirm("Начать новую игру?")) return;
        points = [0, 0];
        serverIndex = 0;
        history = [];
        update();
        saveState();
        showMessage("Новая игра");
    }

    function update() {
        $("score0").textContent = points[0];
        $("score1").textContent = points[1];

        $("teamLabel0").textContent = teamNames[0];
        $("teamLabel1").textContent = teamNames[1];

        var st = serverTeam();
        var name = players[serverIndex];

        $("server0").textContent = st === 0 ? name : "—";
        $("server1").textContent = st === 1 ? name : "—";

        if (st === 0) {
            $("card0").classList.add("serving");
            $("card1").classList.remove("serving");
        } else {
            $("card1").classList.add("serving");
            $("card0").classList.remove("serving");
        }

        if (showSwitchButton) {
            $("btnSwitch").classList.remove("hidden");
        } else {
            $("btnSwitch").classList.add("hidden");
        }
    }

    function showMessage(text) {
        var el = $("message");
        el.textContent = text;
        setTimeout(function () {
            if (el.textContent === text) el.textContent = "";
        }, 2000);
    }

    function openSettings() {
        $("teamName0").value = teamNames[0];
        $("teamName1").value = teamNames[1];
        $("p1").value = players[0];
        $("p2").value = players[1];
        $("p3").value = players[2];
        $("p4").value = players[3];
        $("toggleSwitch").classList.toggle("on", showSwitchButton);
        $("settingsModal").classList.add("open");
    }

    function closeSettings() {
        $("settingsModal").classList.remove("open");
    }

    function saveSettings() {
        teamNames[0] = $("teamName0").value.trim() || "Команда 1";
        teamNames[1] = $("teamName1").value.trim() || "Команда 2";
        players[0] = $("p1").value.trim() || "Игрок 1";
        players[1] = $("p2").value.trim() || "Игрок 2";
        players[2] = $("p3").value.trim() || "Игрок 3";
        players[3] = $("p4").value.trim() || "Игрок 4";
        showSwitchButton = $("toggleSwitch").classList.contains("on");
        closeSettings();
        update();
        saveState();
        showMessage("Сохранено");
    }

    function saveState() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                players: players,
                teamNames: teamNames,
                points: points,
                serverIndex: serverIndex,
                showSwitchButton: showSwitchButton
            }));
        } catch (e) { console.warn("save error", e); }
    }

    function loadState() {
        try {
            var raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return;
            var s = JSON.parse(raw);
            if (Array.isArray(s.players) && s.players.length === 4) players = s.players;
            if (Array.isArray(s.teamNames) && s.teamNames.length === 2) teamNames = s.teamNames;
            if (Array.isArray(s.points) && s.points.length === 2) points = s.points;
            if (typeof s.serverIndex === "number") serverIndex = s.serverIndex;
            if (typeof s.showSwitchButton === "boolean") showSwitchButton = s.showSwitchButton;
        } catch (e) { console.warn("load error", e); }
    }

    function bind() {
        $("card0").addEventListener("click", function () { addPoint(0); });
        $("card1").addEventListener("click", function () { addPoint(1); });

        $("btnSwitch").addEventListener("click", switchServe);
        $("btnUndo").addEventListener("click", undo);
        $("btnReset").addEventListener("click", resetGame);
        $("btnSettings").addEventListener("click", openSettings);
        $("btnCancelSettings").addEventListener("click", closeSettings);
        $("btnSaveSettings").addEventListener("click", saveSettings);
        $("toggleSwitch").addEventListener("click", function () {
            this.classList.toggle("on");
        });
    }

    try {
        localStorage.removeItem("padel_score_state");
        localStorage.removeItem("padel_score_v2");
        localStorage.removeItem("padel_score_v3");
        localStorage.removeItem("padel_score_v4");
        localStorage.removeItem("padel_score_v5");
    } catch (e) {}

    bind();
    loadState();
    update();

})();
</script>

</body>
</html>
