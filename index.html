<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Padel Score</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overscroll-behavior: none;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0a0a0a;
        color: #ffffff;
        min-height: 100vh;
        user-select: none;
    }

    .app {
        max-width: 700px;
        margin: 0 auto;
        padding: 16px 12px 20px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    h1 {
        text-align: center;
        margin: 4px 0 16px;
        font-size: 26px;
        letter-spacing: 2px;
        color: #ffd60a;
        text-transform: uppercase;
    }

    .scoreboard {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        flex: 1;
    }

    .score-card {
        background: #1c1c1e;
        border-radius: 20px;
        padding: 14px 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        border: 3px solid transparent;
        transition: border-color 0.2s, background 0.2s;
        min-height: 380px;
    }

    .score-card.serving {
        border-color: #ffd60a;
        background: #2a2410;
    }

    .team-name {
        width: 100%;
        border: none;
        text-align: center;
        font-size: 18px;
        font-weight: 700;
        outline: none;
        background: transparent;
        color: #ffffff;
        padding: 4px;
    }

    .serve-indicator {
        font-size: 13px;
        font-weight: 700;
        color: #ffd60a;
        letter-spacing: 1px;
        height: 18px;
        opacity: 0;
        transition: opacity 0.2s;
        text-transform: uppercase;
    }

    .score-card.serving .serve-indicator {
        opacity: 1;
    }

    .points {
        font-size: 130px;
        font-weight: 900;
        line-height: 1;
        color: #ffffff;
        font-variant-numeric: tabular-nums;
    }

    .score-card.serving .points {
        color: #ffd60a;
    }

    .point-button {
        width: 100%;
        border: none;
        border-radius: 16px;
        background: #34c759;
        color: #000;
        font-size: 24px;
        font-weight: 800;
        padding: 22px 10px;
        letter-spacing: 1px;
        cursor: pointer;
        transition: transform 0.05s;
    }

    .point-button:active {
        transform: scale(0.96);
        background: #2fb350;
    }

    .controls {
        display: flex;
        gap: 10px;
        margin-top: 14px;
    }

    .control-button {
        flex: 1;
        border: none;
        border-radius: 14px;
        padding: 18px 10px;
        font-size: 15px;
        font-weight: 700;
        background: #2c2c2e;
        color: #ffffff;
        cursor: pointer;
        letter-spacing: 0.5px;
    }

    .control-button:active {
        transform: scale(0.97);
    }

    .serve-button {
        background: #ffd60a;
        color: #000;
        flex: 1.4;
    }

    .reset {
        background: #ff3b30;
        color: white;
    }

    .message {
        text-align: center;
        min-height: 26px;
        margin-top: 10px;
        font-weight: 800;
        font-size: 18px;
        color: #ffd60a;
        letter-spacing: 1px;
    }
</style>
</head>

<body>

<div class="app">

    <h1>🎾 Padel Score</h1>

    <div class="scoreboard">

        <div class="score-card" id="card0">
            <input
                class="team-name"
                id="name0"
                value="Команда 1"
                maxlength="14"
            >
            <div class="serve-indicator">🎾 Подача</div>
            <div class="points" id="score0">0</div>
            <button class="point-button" onclick="addPoint(0)">
                + ОЧКО
            </button>
        </div>

        <div class="score-card" id="card1">
            <input
                class="team-name"
                id="name1"
                value="Команда 2"
                maxlength="14"
            >
            <div class="serve-indicator">🎾 Подача</div>
            <div class="points" id="score1">0</div>
            <button class="point-button" onclick="addPoint(1)">
                + ОЧКО
            </button>
        </div>

    </div>

    <div class="message" id="message"></div>

    <div class="controls">
        <button class="control-button serve-button" onclick="switchServe()">
            🎾 Смена подачи
        </button>
        <button class="control-button" onclick="undo()">
            ↩️ Отмена
        </button>
        <button class="control-button reset" onclick="resetGame()">
            🔄 Новая
        </button>
    </div>

</div>

<script>

let points = [0, 0];
let serving = 0;
let history = [];

const STORAGE_KEY = "padel_score_state";

function saveHistory() {
    history.push({
        points: [...points],
        serving: serving
    });
}

function addPoint(player) {
    saveHistory();
    points[player]++;
    update();
    saveState();
}

function switchServe() {
    saveHistory();
    serving = serving === 0 ? 1 : 0;
    update();
    saveState();
}

function undo() {
    if (history.length === 0) {
        showMessage("Нечего отменять");
        return;
    }
    const prev = history.pop();
    points = prev.points;
    serving = prev.serving;
    update();
    saveState();
}

function resetGame() {
    if (!confirm("Начать новую игру?")) return;
    points = [0, 0];
    serving = 0;
    history = [];
    update();
    saveState();
    showMessage("Новая игра");
}

function update() {
    document.getElementById("score0").textContent = points[0];
    document.getElementById("score1").textContent = points[1];

    document.getElementById("card0").classList.toggle("serving", serving === 0);
    document.getElementById("card1").classList.toggle("serving", serving === 1);
}

function showMessage(text) {
    const el = document.getElementById("message");
    el.textContent = text;
    setTimeout(() => {
        if (el.textContent === text) el.textContent = "";
    }, 2000);
}

/* --- Сохранение между перезагрузками --- */

function saveState() {
    const state = {
        points: points,
        serving: serving,
        names: [
            document.getElementById("name0").value,
            document.getElementById("name1").value
        ]
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function loadState() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    try {
        const state = JSON.parse(raw);
        if (Array.isArray(state.points) && state.points.length === 2) {
            points = state.points;
            serving = state.serving ?? 0;
            if (state.names) {
                document.getElementById("name0").value = state.names[0] || "Команда 1";
                document.getElementById("name1").value = state.names[1] || "Команда 2";
            }
        }
    } catch (e) {
        console.warn("Не удалось загрузить состояние", e);
    }
}

/* Сохраняем имя команды при изменении */
document.getElementById("name0").addEventListener("input", saveState);
document.getElementById("name1").addEventListener("input", saveState);

/* Старт */
loadState();
update();

</script>

</body>
</html>
